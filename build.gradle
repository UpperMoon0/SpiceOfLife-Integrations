plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gameTest {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    gameTestAnnotationProcessor.extendsFrom annotationProcessor
}
def tfcTestVersion = project.findProperty('tfcTestVersion') ?: '3.2.28'
def coreTestFile = project.findProperty('coreTestFile') ?: '9323153'
def backpacksTestFile = project.findProperty('backpacksTestFile') ?: '9323244'
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.debug.export', 'true'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            def profile = (project.hasProperty('withTfc') ? 'tfc-' : '') +
                    (project.hasProperty('withBackpacks') ? 'backpacks' : project.hasProperty('withCore') ? 'core' : 'base')
            workingDirectory project.file(project.findProperty('gameTestRunDir') ?: "run-gametest/${profile}")
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.gameTest } }
        }
    }
}
repositories {
    maven { url 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url 'https://maven.blamejared.com'; content { includeGroup 'vazkii.patchouli' } }
    maven { url 'https://maven.architectury.dev'; content { includeGroup 'dev.architectury' } }
    maven { url 'https://maven.shedaniel.me'; content { includeGroupByRegex 'me\\.shedaniel.*' } }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/'; content { includeGroup 'org.spongepowered' } }
}
jarJar.enable()
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('curse.maven:foodvariations-1109288:8832188')
    runtimeOnly fg.deobf('dev.architectury:architectury-forge:9.2.14')
    compileOnly fg.deobf("maven.modrinth:terrafirmacraft:${tfcTestVersion}")
    compileOnly fg.deobf("curse.maven:sophisticated-core-618298:${coreTestFile}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.0'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.0')) {
        jarJar.ranged(it, '[0.5.0,0.6)')
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (project.hasProperty('withCore') || project.hasProperty('withBackpacks')) {
        runtimeOnly fg.deobf("curse.maven:sophisticated-core-618298:${coreTestFile}")
    }
    if (project.hasProperty('withBackpacks')) {
        runtimeOnly fg.deobf("curse.maven:sophisticated-backpacks-422301:${backpacksTestFile}")
    }
    if (project.hasProperty('withTfc')) {
        runtimeOnly fg.deobf("maven.modrinth:terrafirmacraft:${tfcTestVersion}")
        runtimeOnly fg.deobf('maven.modrinth:patchouli:1.20.1-84.1-forge')
    }
}
mixin { add sourceSets.main, 'solintegrations.refmap.json'; config 'solintegrations.mixins.json' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('processResources') {
    def replacements = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_license: mod_license, mod_description: mod_description]
    inputs.properties replacements
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replacements }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes('MixinConfigs': 'solintegrations.mixins.json', 'Implementation-Version': mod_version)
}
tasks.named('jar') { archiveClassifier = 'slim'; finalizedBy 'reobfJar' }
tasks.named('jarJar') { finalizedBy 'reobfJarJar'; archiveClassifier = '' }

tasks.named('build') { dependsOn 'jarJar' }


// A separate, explicitly requested fixture mod for reobfuscated dedicated-server
// validation. Never included in the installable addon or release package.
sourceSets {
    packagedTest {
        java.srcDir 'src/packagedtest/java'
        resources.srcDir 'src/packagedtest/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.gameTest.output
    }
}
tasks.register('gameTestFixtureJar', Jar) {
    dependsOn tasks.named('gameTestClasses'), tasks.named('packagedTestClasses')
    from sourceSets.gameTest.output
    from sourceSets.packagedTest.output
    manifest.attributes.remove('MixinConfigs')
    archiveClassifier = 'gametest-fixtures'
    destinationDirectory = layout.buildDirectory.dir('gametest-fixtures')
}
reobf { gameTestFixtureJar {} }
tasks.named('gameTestFixtureJar') { finalizedBy 'reobfGameTestFixtureJar' }
